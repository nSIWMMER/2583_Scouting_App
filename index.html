<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#14171A" />
<title>FRC Scouting</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="app-header">
  <div class="brand">Westwood <span>Scouting</span></div>
  <button class="settings-btn" id="settingsBtn">SETTINGS</button>
</header>

<main>
  <form id="scoutForm">

    <div class="card">
      <p class="card-label">Match Info</p>
      <div class="row-2">
        <div class="field">
          <label for="matchType">Match Type</label>
          <select id="matchType">
            <option value="Qual">Qualification</option>
            <option value="Playoff">Playoff</option>
            <option value="Practice">Practice</option>
          </select>
        </div>
        <div class="field">
          <label for="matchNumber">Match #</label>
          <input type="number" id="matchNumber" inputmode="numeric" placeholder="1" required />
        </div>
      </div>
      <div class="field">
        <label for="teamNumber">Team Number</label>
        <input type="number" id="teamNumber" inputmode="numeric" placeholder="e.g. 254" required />
      </div>
      <div class="field">
        <label>Alliance</label>
        <div class="toggle-group" id="allianceGroup">
          <button type="button" class="toggle-btn alliance-red" data-value="red">RED</button>
          <button type="button" class="toggle-btn alliance-blue" data-value="blue">BLUE</button>
        </div>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Starting Position</label>
        <div class="toggle-group" id="startingPositionGroup">
          <button type="button" class="toggle-btn" data-value="Trench (left)">Trench L</button>
          <button type="button" class="toggle-btn" data-value="Trench (right)">Trench R</button>
          <button type="button" class="toggle-btn" data-value="Bump (left)">Bump L</button>
          <button type="button" class="toggle-btn" data-value="Bump (right)">Bump R</button>
          <button type="button" class="toggle-btn" data-value="Center">Center</button>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="card-label">Auto</p>
      <div class="field">
        <label for="autoScoreVal">Total Auto Fuel Scored</label>
        <input type="number" id="autoScoreVal" inputmode="numeric" min="0" value="0" />
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Auto Climb</label>
        <div class="toggle-group" id="autoClimbGroup">
          <button type="button" class="toggle-btn" data-value="No Climb">No Climb</button>
          <button type="button" class="toggle-btn" data-value="Failed Climb">Failed Climb</button>
          <button type="button" class="toggle-btn" data-value="L1">L1</button>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="card-label">Teleop</p>
      <div class="field">
        <label for="teleopScoreVal">Fuel Scored per Cycle</label>
        <input type="number" id="teleopScoreVal" inputmode="numeric" min="0" value="0" />
      </div>
      <div class="field">
        <label for="cyclesPerMatchVal">Number of Cycles per Match</label>
        <input type="number" id="cyclesPerMatchVal" inputmode="numeric" min="0" value="0" />
      </div>
      <div class="field">
        <label>Defense Rating (1 = none, 5 = shut down)</label>
        <div class="toggle-group" id="defenseGroup">
          <button type="button" class="toggle-btn" data-value="1">1</button>
          <button type="button" class="toggle-btn" data-value="2">2</button>
          <button type="button" class="toggle-btn" data-value="3">3</button>
          <button type="button" class="toggle-btn" data-value="4">4</button>
          <button type="button" class="toggle-btn" data-value="5">5</button>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="card-label">Endgame</p>
      <div class="field">
        <div class="toggle-group" id="endgameGroup">
          <button type="button" class="toggle-btn" data-value="None">None</button>
          <button type="button" class="toggle-btn" data-value="Failed Climb">Failed Climb</button>
          <button type="button" class="toggle-btn" data-value="L1">L1</button>
          <button type="button" class="toggle-btn" data-value="L2">L2</button>
          <button type="button" class="toggle-btn" data-value="L3">L3</button>
        </div>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>
          <input type="checkbox" id="brokeDown" style="width:auto;display:inline-block;margin-right:8px;" />
          Robot broke down / had major issue
        </label>
      </div>
    </div>

    <div class="card">
      <p class="card-label">Notes &amp; Photo</p>
      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Fast cycle times, good driver, prone to tipping..."></textarea>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Photo</label>
        <div class="photo-input-wrap">
          <label class="photo-btn" for="photoInput">Tap to add photo</label>
          <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" />
          <img id="photoPreview" class="photo-preview" alt="preview" />
        </div>
      </div>
    </div>

    <button type="submit" class="submit-btn">Save Scouting Entry</button>
  </form>
</main>

<div class="telemetry-bar">
  <div class="telemetry-status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Offline</span>
  </div>
  <div class="telemetry-queue">
    Queued: <span class="count zero" id="queueCount">0</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>Settings</h2>
    <div class="field">
      <label for="scouterName">Your Name (required)</label>
      <input type="text" id="scouterName" placeholder="e.g. Jordan" required />
    </div>
    <div class="field">
      <label for="eventKey">Event Key (TBA code, optional)</label>
      <input type="text" id="eventKey" placeholder="e.g. 2026txaus" />
    </div>
    <div class="field" style="margin-bottom:0">
      <label for="apiUrl">Apps Script Web App URL</label>
      <input type="text" id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec" />
      <p class="field-hint">Paste the deployment URL from the backend setup.</p>
      <label for="apiSecret">Shared Secret</label>
      <input type="text" id="apiSecret" placeholder="must match SHARED_SECRET in Code.gs" />
    </div>
    <div class="modal-actions">
      <button type="button" class="cancel-btn" id="settingsCancel">Cancel</button>
      <button type="button" class="save-btn" id="settingsSave">Save</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
